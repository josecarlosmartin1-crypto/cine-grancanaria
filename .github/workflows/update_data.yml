name: Update Cinema Data
on:
  schedule:
    - cron: '0 9 * * *'  # 10:00 AM Canarias (Primera batida - Todo)
    - cron: '0 10 * * *' # 11:00 AM Canarias (Reintento 1 - Solo Ocine si falta)
    - cron: '0 11 * * *' # 12:00 PM Canarias (Reintento 2 - Solo Ocine si falta)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper
      
      - name: Full Run (9 AM UTC)
        if: github.event.schedule == '0 9 * * *'
        run: python scraper/main.py --force
        
      - name: Conditional Retry (10 AM & 11 AM UTC)
        if: github.event.schedule == '0 10 * * *' || github.event.schedule == '0 11 * * *' || github.event_name == 'workflow_dispatch'
        run: python scraper/main.py --only-ocine

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data.js scraper/tmdb_cache.json scraper/ocine_last_error.log || true
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Auto-update movie data (conditional run)' && git push)
