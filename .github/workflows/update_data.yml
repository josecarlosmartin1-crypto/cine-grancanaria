name: Update Cinema Data
on:
  schedule:
    - cron: '23 9 * * *'  # 10:23 AM Canarias (Primera batida - Todo)
    - cron: '23 10 * * *' # 11:23 AM Canarias (Reintento 1 - Solo Ocine si falta)
    - cron: '23 11 * * *' # 12:23 PM Canarias (Reintento 2 - Solo Ocine si falta)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper
      
      - name: Full Run (9:23 UTC or manual dispatch)
        if: github.event.schedule == '23 9 * * *' || github.event_name == 'workflow_dispatch'
        run: python scraper/main.py --force
        
      - name: Conditional Retry (10:23 & 11:23 UTC)
        if: github.event.schedule == '23 10 * * *' || github.event.schedule == '23 11 * * *'
        run: python scraper/main.py --only-ocine

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data.js scraper/tmdb_cache.json
          if [ -f scraper/ocine_last_error.log ]; then git add scraper/ocine_last_error.log; fi
          if ! git diff --staged --quiet; then
            git commit -m 'Auto-update movie data (conditional run)'
            git pull --rebase origin main || true
            git push
          fi
